<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Mors Pet Realeza</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --orange: #F26522;
    --orange-dark: #d4521a;
    --orange-pale: #fff4ee;
    --dark: #1a1412;
    --gray: #6b6560;
    --gray-pale: #f5f2ef;
    --beige: #f9f4ef;
    --beige-dark: #ede4d8;
    --white: #ffffff;
    --red: #ef4444;
    --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, #1a1412 0%, #2d2019 50%, #1a1412 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(242,101,34,0.06) 1px, transparent 1px);
    background-size: 36px 36px;
  }
  .bg-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
  }
  .bg-blob-1 { width: 400px; height: 400px; background: var(--orange); top: -100px; right: -100px; }
  .bg-blob-2 { width: 300px; height: 300px; background: #8b1a00; bottom: -80px; left: -80px; }

  .login-card {
    background: var(--white);
    border-radius: 28px;
    padding: 48px 40px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 40px 100px rgba(0,0,0,0.5);
    position: relative;
    z-index: 1;
    animation: slideUp 0.4s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(32px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .login-header { text-align: center; margin-bottom: 36px; }
  .login-logo {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
    margin: 0 auto 20px;
    box-shadow: 0 8px 28px rgba(242,101,34,0.4);
    overflow: hidden;
  }
  .login-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; }
  .login-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 900; color: var(--dark); margin-bottom: 6px; }
  .login-sub { font-size: 14px; color: var(--gray); }
  .admin-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(242,101,34,0.1); color: var(--orange);
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    padding: 5px 12px; border-radius: 20px; margin-top: 10px;
    border: 1px solid rgba(242,101,34,0.2);
  }

  .form-group { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
  .form-group label { font-size: 13px; font-weight: 600; color: var(--dark); }
  .input-wrap { position: relative; }
  .input-wrap i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--gray); font-size: 15px; }
  .input-wrap input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    border: 1.5px solid var(--beige-dark);
    border-radius: 12px;
    font-size: 15px; font-family: 'DM Sans', sans-serif;
    color: var(--dark); background: var(--gray-pale);
    transition: var(--transition); outline: none;
  }
  .input-wrap input:focus { border-color: var(--orange); background: var(--white); box-shadow: 0 0 0 3px rgba(242,101,34,0.12); }
  .toggle-pw {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--gray);
    font-size: 15px; padding: 4px; transition: var(--transition);
  }
  .toggle-pw:hover { color: var(--orange); }

  .btn-login {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color: var(--white);
    border: none;
    border-radius: 50px;
    font-size: 16px; font-weight: 700;
    cursor: pointer; transition: var(--transition);
    font-family: 'DM Sans', sans-serif;
    box-shadow: 0 6px 24px rgba(242,101,34,0.4);
    margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(242,101,34,0.5); }
  .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

  .error-msg {
    display: none;
    background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b;
    padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
    text-align: center; margin-top: 14px;
  }
  .error-msg.show { display: flex; align-items: center; justify-content: center; gap: 8px; }

  .back-link {
    text-align: center; margin-top: 20px;
    font-size: 13px; color: var(--gray);
  }
  .back-link a { color: var(--orange); text-decoration: none; font-weight: 600; }
  .back-link a:hover { text-decoration: underline; }

  .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .login-card { padding: 36px 28px; }
  }
</style>
</head>
<body>
<div class="bg-blob bg-blob-1"></div>
<div class="bg-blob bg-blob-2"></div>

<div class="login-card">
  <div class="login-header">
    <div class="login-logo">
      <img src="logo.jpg" alt="Logo" onerror="this.parentElement.innerHTML='🐾'">
    </div>
    <h1 class="login-title">Mors Pet Realeza</h1>
    <p class="login-sub">Acesso restrito ao painel administrativo</p>
    <div class="admin-badge">
      <i class="fa-solid fa-shield-halved"></i> Área Admin
    </div>
  </div>

  <div class="form-group">
    <label>Usuário</label>
    <div class="input-wrap">
      <i class="fa-regular fa-user"></i>
      <input type="text" id="adminUser" placeholder="Usuário admin" autocomplete="username">
    </div>
  </div>
  <div class="form-group">
    <label>Senha</label>
    <div class="input-wrap">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="adminPass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="toggle-pw" onclick="togglePassword()" type="button" id="toggleBtn">
        <i class="fa-regular fa-eye" id="eyeIcon"></i>
      </button>
    </div>
  </div>

  <button class="btn-login" onclick="doLogin()" id="loginBtn">
    <i class="fa-solid fa-right-to-bracket"></i> Entrar no Painel
  </button>
  <div class="error-msg" id="errorMsg">
    <i class="fa-solid fa-circle-exclamation"></i>
    <span id="errorText">Usuário ou senha incorretos.</span>
  </div>

  <div class="back-link"><a href="index.html">← Voltar ao site</a></div>
</div>

<script>
  // Redirect if already logged in
  if (sessionStorage.getItem('mors_admin_logged') === 'true') {
    window.location.href = 'admin.html';
  }

  const ADMIN_USER = 'petbemcuidado';
  const ADMIN_PASS = 'petshopnota1000';

  function doLogin() {
    const user = document.getElementById('adminUser').value.trim();
    const pass = document.getElementById('adminPass').value;
    const btn = document.getElementById('loginBtn');
    const errMsg = document.getElementById('errorMsg');
    const errText = document.getElementById('errorText');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Verificando...';
    errMsg.classList.remove('show');

    setTimeout(() => {
      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        sessionStorage.setItem('mors_admin_logged', 'true');
        sessionStorage.setItem('mors_admin_user', user);
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Acessando...';
        setTimeout(() => { window.location.href = 'admin.html'; }, 500);
      } else {
        errText.textContent = 'Usuário ou senha incorretos.';
        errMsg.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar no Painel';
        document.getElementById('adminPass').value = '';
        document.getElementById('adminPass').focus();
      }
    }, 600);
  }

  function togglePassword() {
    const inp = document.getElementById('adminPass');
    const icon = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.className = 'fa-regular fa-eye-slash';
    } else {
      inp.type = 'password';
      icon.className = 'fa-regular fa-eye';
    }
  }
</script>
</body>
</html>
